name: Probe Reading Garden Gemini capacity

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/probe-reading-gemini-capacity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'complete-open-reading-garden-20260822' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Probe configured Gemini model capacity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://hrycfsekrvflrbwahgyh.supabase.co/functions/v1/sakura-gemini-capacity-probe' \
            -o probe.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('probe.json','utf8'));
          const rows = Array.isArray(payload.results) ? payload.results : [];
          console.log(JSON.stringify(rows, null, 2));
          if (!rows.some(row => row.ok === true)) {
            console.error('No configured Gemini model currently has capacity.');
            process.exit(1);
          }
          NODE
